[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "java-audit-lab"
version = "2.0.1"
description = "An evidence-driven Java security review workbench"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Java Audit Lab contributors"}]
dependencies = []

[project.scripts]
java-audit = "audit.cli:main"
jal = "audit.cli:main"

[tool.setuptools.packages.find]
include = ["audit*"]

[tool.setuptools.package-data]
audit = ["rules/*.yml", "benchmarks/*.json", "benchmarks/*/*.java"]
