# Copy to the root of the Java project as .java-audit.yml
scanners:
  - builtin
  - secrets
  - taint
  - semgrep
  - spotbugs
  - dependency-check
  - codeql
fail_on: high
ai_level: beginner
cache: true
exclude_paths:
  - src/test/*
  - generated/*
extra_rules: []
public_endpoints:
  - /login
  - /health
# 可选的专业报告档案字段；不会据此自动声明已经获得授权
report_owner: ""
authorization_ref: ""
scope_note: ""
retention_note: ""
# 添加团队规则时改为：
# extra_rules: [.java-audit/rules/team-rules.yaml]
