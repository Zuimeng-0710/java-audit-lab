    <text x="132" y="659" fill="#0f172a" font-size="36" font-weight="800">Java Audit Lab</text>
    <path d="M132 678h1336" stroke="#d8dee4"/>
    <text x="132" y="723" fill="#24292f" font-size="17">Java Audit Lab 是面向 Java 学习者、开发者和安全审计人员的开源代码审计工作台。</text>
    <text x="132" y="752" fill="#24292f" font-size="17">它把扫描命中整理成可复核的证据链，帮助你理解“为什么可疑、还缺什么证据、如何人工验证”。</text>

    <rect x="132" y="790" width="1336" height="74" rx="8" fill="#fff8c5" stroke="#d4a72c"/>
    <text x="155" y="819" fill="#633c01" font-size="15" font-weight="800">IMPORTANT</text>
    <text x="155" y="844" fill="#633c01" font-size="15">扫描结果是待人工复核的安全线索，不等于已确认漏洞。请只分析已获得明确授权的项目。</text>

    <text x="132" y="922" fill="#0f172a" font-size="29" font-weight="800">为什么使用 Java Audit Lab</text>
    <text x="132" y="950" fill="#94a3b8" font-size="13">README light open-source style preview · docs/readme-redesign</text>
