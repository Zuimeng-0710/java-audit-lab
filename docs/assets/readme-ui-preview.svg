    <text x="350" y="210" fill="#a5b4fc" font-size="15" font-weight="700" letter-spacing="3">EVIDENCE-DRIVEN SECURITY REVIEW</text><text x="346" y="275" fill="#fff" font-size="58" font-weight="800">Java Audit Lab</text><text x="350" y="318" fill="#bdc9df" font-size="22">From scanner findings to reviewable evidence.</text>
    <g transform="translate(350 350)" font-size="14" font-weight="700"><rect width="146" height="38" rx="10" fill="#172846" stroke="#385077"/><text x="23" y="25" fill="#e2e8f0">12 Java rules</text><rect x="158" width="166" height="38" rx="10" fill="#172846" stroke="#385077"/><text x="181" y="25" fill="#e2e8f0">4 report formats</text><rect x="336" width="138" height="38" rx="10" fill="#172846" stroke="#385077"/><text x="360" y="25" fill="#e2e8f0">Local-first</text></g>
    <text x="660" y="488" fill="#0f172a" font-size="36" font-weight="800">Java Audit Lab</text><text x="515" y="527" fill="#475569" font-size="18">把扫描命中整理成可复核的证据链</text>
    <g transform="translate(570 548)" font-size="13" font-weight="700"><rect width="120" height="28" rx="7" fill="#eef2ff"/><text x="19" y="19" fill="#4f46e5">release v1.8.0</text><rect x="132" width="104" height="28" rx="7" fill="#ecfeff"/><text x="154" y="19" fill="#0891b2">tests passing</text><rect x="248" width="102" height="28" rx="7" fill="#ecfdf5"/><text x="272" y="19" fill="#059669">MIT license</text></g>
