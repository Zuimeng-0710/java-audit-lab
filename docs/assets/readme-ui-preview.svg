    <text x="132" y="734" fill="#0f172a" font-size="29" font-weight="800">Why Java Audit Lab</text>
    <g transform="translate(132 766)"><rect width="318" height="152" rx="16" fill="#f8fafc" stroke="#e2e8f0"/><circle cx="36" cy="37" r="16" fill="#cffafe"/><text x="65" y="43" fill="#0f172a" font-size="18" font-weight="750">Evidence first</text><text x="24" y="82" fill="#64748b" font-size="14">Source, propagation, sink,</text><text x="24" y="105" fill="#64748b" font-size="14">sanitizers and authorization.</text><rect x="338" width="318" height="152" rx="16" fill="#f8fafc" stroke="#e2e8f0"/><circle cx="374" cy="37" r="16" fill="#e0e7ff"/><text x="403" y="43" fill="#0f172a" font-size="18" font-weight="750">Honest uncertainty</text><text x="362" y="82" fill="#64748b" font-size="14">Proven, inferred, missing</text><text x="362" y="105" fill="#64748b" font-size="14">and unresolved paths.</text><rect x="676" width="318" height="152" rx="16" fill="#f8fafc" stroke="#e2e8f0"/><circle cx="712" cy="37" r="16" fill="#f3e8ff"/><text x="741" y="43" fill="#0f172a" font-size="18" font-weight="750">Review workflow</text><text x="700" y="82" fill="#64748b" font-size="14">Baselines, findings, verdicts</text><text x="700" y="105" fill="#64748b" font-size="14">and remediation verification.</text><rect x="1014" width="322" height="152" rx="16" fill="#f8fafc" stroke="#e2e8f0"/><circle cx="1050" cy="37" r="16" fill="#d1fae5"/><text x="1079" y="43" fill="#0f172a" font-size="18" font-weight="750">Local first</text><text x="1038" y="82" fill="#64748b" font-size="14">Works without uploading source.</text><text x="1038" y="105" fill="#64748b" font-size="14">AI remains optional.</text></g>
    <text x="132" y="950" fill="#94a3b8" font-size="14">README redesign preview · docs/readme-redesign</text>
