name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m audit benchmark
      - run: java-audit scan examples/vulnerable-demo -o audit-report --scanners builtin
      - run: javac -d /tmp/jal-classes examples/vulnerable-demo/src/main/java/lab/AuditPractice.java
      - uses: actions/upload-artifact@v4
        with:
          name: audit-report-py${{ matrix.python-version }}
          path: audit-report/
